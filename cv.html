<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Resume – Benjamin Liljeblad</title>

    <style>
        /* ====== THEME VARIABLES ====== */
        :root[data-theme='light'] {
            --bg-color: #f4f4f4;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --accent: #c7d1e0;
            --header-bg: #222;
            --nav-bg: #333;
            --nav-text: white;
            --btn-bg: #222;
            --btn-text: white;
            --link-color: #0066cc; /* Light mode link */
        }

        :root[data-theme='dark'] {
            --bg-color: #1a1a1a;
            --text-color: #f1f1f1;
            --card-bg: #2a2a2a;
            --accent: #444;
            --header-bg: #000;
            --nav-bg: #111;
            --nav-text: #e6e6e6;
            --btn-bg: #333;
            --btn-text: #f1f1f1;
            --link-color: #4da3ff; /* Dark mode link */
        }

        :root[data-theme='darkblue-old'] {
            --bg-color: #0d1b2a;
            --text-color: #e0e6ed;
            --card-bg: #1b263b;
            --accent: #415a77;
            --header-bg: #0d1b2a;
            --nav-bg: #1b263b;
            --nav-text: #e0e6ed;
            --btn-bg: #415a77;
            --btn-text: #e0e6ed;
            --link-color: #7fb3ff; /* Dark blue link */
        }

        /* ====== ORIGINAL STYLES (struktur 100% bevarad) ====== */
        body { 
            margin:0; 
            font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height:1.6; 
            background: var(--bg-color); 
            color: var(--text-color);
        }

        header { 
            background: var(--header-bg); 
            color:white; 
            padding:20px; 
            text-align:center; 
        }

        nav { 
            background: var(--nav-bg); 
            padding:10px; 
            text-align:center; 
        }

        nav a { 
            color: var(--nav-text); 
            margin:0 15px; 
            text-decoration:none; 
            font-size:18px; 
        }

        nav a:hover { 
            text-decoration:underline; 
        }

        /* ====== LINK COLOR FOR CONTENT ====== */
        .container a:not(.btn) {
            color: var(--link-color);
            text-decoration: none;
            font-weight: bold;
        }

        .container a:not(.btn):hover {
            opacity: 0.8;
        }

        .container {
            max-width:900px;
            margin:40px auto;
            background: var(--card-bg);
            padding:40px;
            border-radius:12px;
            border:2px solid var(--accent);
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        .btn {
            display:inline-block;
            padding:12px 20px;
            background: var(--btn-bg);
            color: var(--btn-text);
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
            margin-top:10px;
        }

        .btn:hover { 
            background:#444; 
        }

        h2 {
            margin-top:30px;
            margin-bottom:10px;
        }

        /* ====== SETTINGS ICON ====== */
        .settings-icon {
            position: fixed;
            top: 20px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s ease;
        }

        .settings-icon:hover {
            transform: rotate(20deg);
        }

        /* ====== SETTINGS MENU ====== */
        .settings-menu {
            position: fixed;
            top: 70px;
            right: 25px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 15px;
            width: 160px;
            display: none;
            box-shadow:0 4px 20px rgba(0,0,0,0.15);
            z-index: 9999;
        }

        .settings-menu h3 {
            margin-top: 0;
            font-size: 18px;
            text-align: center;
            color: var(--text-color);
        }

        .settings-menu button {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            font-weight: bold;
            color: var(--text-color);
            transition: background 0.2s ease;
        }

        .settings-menu button:hover {
            background: #b5c0d3;
        }

        .intro { margin-top: -8px; opacity: 0.8; }
        .cv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 24px; }
        .cv-card { border: 2px solid var(--accent); border-radius: 12px; padding: 24px; text-align: center; background: var(--card-bg); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .cv-icon { font-size: 36px; }
        .cv-card h2 { margin: 8px 0 2px; }
        .cv-meta { margin: 0 0 16px; font-size: 14px; opacity: 0.7; }
        .cv-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .cv-actions .btn { margin-top: 0; font-size: 16px; font-weight: 600; }
        .btn-outline { background: transparent !important; color: var(--text-color) !important; border: 2px solid var(--accent); }
        .btn-outline:hover { border-color: var(--text-color); }

        /* ====== THEME POLISH ====== */
        :root[data-theme='light'] { --primary: #3b4a63; --primary-soft: #eef1f5; --header-grad: linear-gradient(135deg, #1f2937, #374151); --on-primary: #fff; }
        :root[data-theme='dark'] { --primary: #a5b4c8; --primary-soft: #333842; --header-grad: linear-gradient(135deg, #000, #1f1f1f); --on-primary: #111; }
        :root[data-theme='blue'] {
            --bg-color: #f3f6fb; --text-color: #1a1a1a; --card-bg: #ffffff; --accent: #c7d6f2;
            --nav-bg: #1e293b; --nav-text: #f1f5f9; --link-color: #2563eb;
            --primary: #2563eb; --primary-soft: #e0eaff; --header-grad: linear-gradient(135deg, #1e3a8a, #2563eb); --on-primary: #fff;
        }
        header { background: var(--header-grad); font-size: 26px; font-weight: 700; letter-spacing: 0.5px; padding: 28px 20px; }
        nav { border-bottom: 3px solid var(--primary); }
        nav a { padding: 4px 2px; border-bottom: 2px solid transparent; }
        nav a:hover { text-decoration: none; border-bottom-color: var(--primary); }
        .container { border-top: 5px solid var(--primary); }
        .container h1 { color: var(--primary); margin-top: 0; }
        .container h2 { position: relative; padding-left: 14px; }
        .container h2::before { content: ""; position: absolute; left: 0; top: 15%; height: 70%; width: 4px; border-radius: 4px; background: var(--primary); }
        .cv-card h2 { padding-left: 0; }
        .cv-card h2::before { display: none; }
        .accordion-content ul.skills li { background: var(--primary-soft); color: var(--text-color); border: 1px solid var(--primary); }
        .btn { background: var(--primary) !important; color: var(--on-primary) !important; }
        .btn:hover { filter: brightness(1.1); }
        .btn-outline { background: transparent !important; color: var(--text-color) !important; border: 2px solid var(--primary); }
        .cv-card, .contact-card, .about-box, .accordion { border-color: var(--primary-soft) !important; }
        a.contact-card:hover, .cv-card:hover { border-color: var(--primary) !important; }

        /* ====== MOBILE ====== */
        @media (max-width: 600px) {
            .container { margin: 16px; padding: 20px; }
            .about-box, .accordion { padding: 18px; }
            nav a { display: inline-block; margin: 6px 10px; font-size: 16px; }
            header { padding: 16px 60px; font-size: 18px; }
            .settings-icon { top: 14px; right: 16px; }
            .settings-menu { top: 60px; right: 16px; }
        }
    </style>
</head>

<body>

<header>My Resume</header>

<nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
    <a href="cv.html">CV</a>
</nav>

<!-- ====== SETTINGS ICON ====== -->
<div class="settings-icon" onclick="toggleSettingsMenu()">⚙️</div>

<!-- ====== SETTINGS MENU ====== -->
<div id="settings-menu" class="settings-menu">
    <h3>Theme</h3>
    <button onclick="setTheme('light')">Light</button>
    <button onclick="setTheme('dark')">Dark</button>
    <button onclick="setTheme('blue')">Blue</button>
</div>

<div class="container">
    <h1>My resume</h1>
    <p class="intro">Download or view my CV in Swedish or English.</p>

    <div class="cv-grid">
        <div class="cv-card">
            <div class="cv-icon">📄</div>
            <h2>Svenska</h2>
            <p class="cv-meta">CV · PDF</p>
            <div class="cv-actions">
                <a class="btn" href="CV.pdf" download>⬇ Download</a>
                <a class="btn btn-outline" href="CV.pdf" target="_blank" rel="noopener">View</a>
            </div>
        </div>

        <div class="cv-card">
            <div class="cv-icon">📄</div>
            <h2>English</h2>
            <p class="cv-meta">Resume · PDF</p>
            <div class="cv-actions">
                <a class="btn" href="Resume.pdf" download>⬇ Download</a>
                <a class="btn btn-outline" href="Resume.pdf" target="_blank" rel="noopener">View</a>
            </div>
        </div>
    </div>
</div>

<!-- ====== JAVASCRIPT ====== -->
<script>
function toggleSettingsMenu() {
    const menu = document.getElementById("settings-menu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
}

function loadTheme() {
    let savedTheme = localStorage.getItem("theme") || "light";
    if (savedTheme === "darkblue") savedTheme = "blue";
    document.documentElement.setAttribute("data-theme", savedTheme);
}

loadTheme();
</script>

</body>
</html>
